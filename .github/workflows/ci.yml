name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "default = path/schedule rules; release = always run ML suite"
        type: choice
        options:
          - default
          - release
        default: default
  schedule:
    # Weekly ML suite (Sunday 06:00 UTC)
    - cron: "0 6 * * 0"

jobs:
  tests:
    # Governance / control-plane — required on every PR/push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test extras
        run: |
          pip install -r requirements_streamlit.txt -r requirements_api.txt
          pip install pytest pandas numpy
      - name: Governance and control-plane tests
        run: python -m pytest tests/test_dpia_workspace.py tests/test_control_plane.py tests/test_control_plane_security.py tests/test_api_security.py tests/test_import_surface.py -q
      - name: Import surface
        run: python -c "from utils.data_loaders import load_model_info; import api_server; from src.control_plane.runtime import execute_guarded; assert api_server.app is not None"

  ml-paths:
    # Detect ML-relevant path changes for PR/push. Always true for schedule / workflow_dispatch.
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Path filter
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ml=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              echo "ml=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "Changed files:"
          echo "$CHANGED"
          PATTERN='^(src/models/|src/data_processing/|src/monitoring/|tests/test_.*ebm|tests/test_feature|tests/test_drift|tests/test_model|tests/test_robust|tests/test_fairness|tests/test_proper|tests/test_synthetic_robust|requirements-ml\.|run_training)'
          if echo "$CHANGED" | grep -E "$PATTERN" >/dev/null; then
            echo "ml=true" >> "$GITHUB_OUTPUT"
          else
            echo "ml=false" >> "$GITHUB_OUTPUT"
          fi

  ml-synthetic:
    needs: ml-paths
    # Path-filtered on PR/push; weekly schedule; any workflow_dispatch (incl. release).
    if: needs.ml-paths.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML test deps (lock preferred)
        run: |
          if [ -f requirements-ml.lock ]; then
            pip install -r requirements-ml.lock
          else
            pip install -r requirements-ml.txt
          fi
      - name: Synthetic EBM / FE / drift / robustness suite
        run: >
          python -m pytest
          tests/test_feature_engineering.py
          tests/test_proper_pipeline.py
          tests/test_ebm_pipeline.py
          tests/test_drift_monitoring.py
          tests/test_model_evaluation.py
          tests/test_robustness.py
          tests/test_fairness_subgroups.py
          tests/test_synthetic_robustness.py
          -q
          --tb=short
