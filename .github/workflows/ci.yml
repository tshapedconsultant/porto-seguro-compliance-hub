name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test extras
        run: pip install pytest pandas numpy
      - name: Governance and control-plane tests
        run: python -m pytest tests/test_dpia_workspace.py tests/test_control_plane.py tests/test_import_surface.py -q
      - name: Import surface
        run: python -c "from utils.data_loaders import load_model_info; from src.control_plane.runtime import execute_guarded"
